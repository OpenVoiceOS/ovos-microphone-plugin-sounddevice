[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_microphone_plugin_sounddevice"
dynamic = ["version"]
description = "A sounddevice microphone implementation for OVOS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gaëtan Trellu (goldyfruit)", email = "gaetan.trellu@gmail.com"}
]
keywords = ["ovos", "plugin", "listener", "microphone", "sounddevice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "SpeechRecognition>=3.8.1",
    "sounddevice"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-microphone-plugin-sounddevice"

[project.entry-points."opm.microphone"]
"ovos-microphone-plugin-sounddevice" = "ovos_microphone_plugin_sounddevice:SoundDeviceMicrophone"

[tool.setuptools.dynamic]
version = {attr = "ovos_microphone_plugin_sounddevice.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_microphone_plugin_sounddevice*"]
